name: Publish to HDX

on:
  workflow_run:
    workflows: ["Scheduled Data Ingestion"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hdx-python-api

      - name: Generate HXL-tagged datasets
        env:
          DATA_DIR: ./data
        run: python -m src.reporting.generate_hdx_datasets

      - name: Publish to HDX
        env:
          HDX_API_KEY: ${{ secrets.HDX_API_KEY }}
          HDX_SITE: prod
        run: python -m src.reporting.publish_hdx

      - name: Send report email
        env:
          MAIL_API_BASE_URL: ${{ secrets.MAIL_API_BASE_URL }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          REPORT_TO: ${{ vars.REPORT_TO || 'admin@evomap.ai' }}
        run: python -m src.reporting.email_report
